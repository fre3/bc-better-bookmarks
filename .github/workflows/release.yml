name: Publish unpacked extension
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify production tag and build
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          git merge-base --is-ancestor HEAD origin/master
          npm ci
          npm run check
          git diff --exit-code -- dist
      - name: Package exact runtime artifact
        run: python3 scripts/package-release.py "$RUNNER_TEMP/release"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/* \
            --verify-tag --title "Indexfold $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" --latest
