name: Publish unpacked extension
on:
  push:
    tags: ['v*']
    branches: [master]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-indexfold
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve immutable production tag
        run: |
          RELEASE_TAG="v$(node -p "require('./package.json').version")"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/master
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          git checkout --detach "$RELEASE_TAG"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify production tag and build
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          git merge-base --is-ancestor HEAD origin/master
          npm ci
          npm run check
          git diff --exit-code -- dist
      - name: Package exact runtime artifact
        run: python3 scripts/package-release.py "$RUNNER_TEMP/release"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving its published assets."
            exit 0
          fi
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/release/* \
            --verify-tag --title "Indexfold $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" --latest
